<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>街頭英豪</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed first-person viewport; HUD pinned to the four corners; agent picker as a dossier sheet over a slow orbit of the map */
:root{
  --ink:#0f1112;
  --line:#2b2924;
  --paper:#ece6d8;
  --muted:#9b9383;
  --signal:#e9c46a;
  --hostile:#ff6b57;
  --f-display:"Saira Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%}
#gl{display:block;width:100%;height:100%;touch-action:none;outline:none}
#app.playing #gl{cursor:none}
#hud2d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:absolute;pointer-events:none;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.45)}
#score{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(15,17,18,.72);border:1px solid var(--line);padding:6px 16px}
#score .n{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
#score .foe{color:var(--hostile)}
#score .mid{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);letter-spacing:.12em}
#score .alive{display:flex;gap:4px;margin-top:3px}
#score .alive i{width:8px;height:8px;background:var(--hostile);transform:rotate(45deg)}
#score .alive i.dead{background:transparent;border:1px solid var(--muted)}
#vitals{left:max(16px,env(safe-area-inset-left,0px));bottom:16px}
#hpNum{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:.9}
#hpBar{width:150px;height:6px;background:var(--line);margin-top:6px}
#hpFill{height:100%;background:var(--paper);transition:width .15s}
#agentTag,#wname{font-size:11px;letter-spacing:.14em;color:var(--muted)}
#arms{right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;align-items:flex-end;gap:16px;text-align:right}
#ammo{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:.9}
#ammo small{font-size:22px;color:var(--muted)}
#abil{width:58px;height:58px;position:relative}
#abil svg{position:absolute;inset:0}
#abil b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
#abil span{position:absolute;left:-10px;right:-10px;bottom:-15px;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.1em}
#feed{top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px}
#feed div{background:rgba(15,17,18,.75);padding:3px 8px;border-left:2px solid var(--signal)}
#feed div.bad{border-left-color:var(--hostile)}
#feed div em{font-style:normal;color:var(--signal);margin-left:6px}
#banner{top:26%;left:0;right:0;text-align:center;font-family:var(--f-display)}
#banner .big{font-size:clamp(40px,9vw,88px);font-weight:800;letter-spacing:.04em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#banner .sub{font-family:var(--f-body);font-size:15px;color:var(--paper);margin-top:6px;text-shadow:0 1px 6px #000}
#banner.win .big{color:var(--signal)} #banner.lose .big{color:var(--hostile)}
#hint{bottom:92px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(15,17,18,.7);padding:4px 10px;white-space:nowrap}
#note{top:58%;left:50%;transform:translateX(-50%);background:var(--signal);color:var(--ink);font-family:var(--f-body);font-weight:700;padding:8px 16px;font-size:15px;white-space:nowrap}

.sheet{position:absolute;inset:0;overflow-y:auto;background:rgba(10,11,12,.78);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--signal);text-transform:uppercase}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(48px,9vw,96px);line-height:.88;text-wrap:balance}
h1 em{font-style:normal;color:var(--signal)}
.lede{margin:0;color:#c9c1b1;max-width:60ch;line-height:1.6}
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}
.agent{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);background:#16161a;min-width:0;position:relative}
.agent:hover{border-color:var(--muted)}
.agent:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.agent[aria-pressed="true"]{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#16161a),#16161a 70%)}
.agent .top{display:flex;align-items:center;gap:10px}
.agent .glyph{width:38px;height:38px;flex:none}
.agent .nm{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.agent .en{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.agent .role{position:absolute;top:12px;right:12px;font-size:11px;color:var(--c);border:1px solid currentColor;padding:1px 6px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;font-size:11px;color:var(--muted)}
.stats .bar{height:4px;background:var(--line)} .stats .bar i{display:block;height:100%;background:var(--c)}
.agent .ab{font-size:12px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px}
.agent .ab b{color:var(--c)}
.agent .wp{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.diff{display:flex;border:1px solid var(--line)}
.diff button{all:unset;cursor:pointer;padding:8px 14px;font-size:13px;color:var(--muted)}
.diff button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700}
.diff button:focus-visible{outline:2px solid var(--signal)}
.sens{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px}
.sens input{width:130px;accent-color:var(--signal)}
.modes button{font-weight:500}
.diff button:disabled{opacity:.35;cursor:not-allowed}
.netp{border:1px solid var(--line);background:#141519;padding:14px;display:flex;flex-direction:column;gap:10px}
.netrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.netrow input{font-family:var(--f-mono);font-size:22px;letter-spacing:.2em;width:7.5em;max-width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);padding:6px 10px;outline:none}
.netrow input:focus-visible{border-color:var(--signal)}
.btn2{all:unset;cursor:pointer;border:1px solid var(--paper);padding:8px 16px;font-size:14px;font-weight:700}
.btn2:hover{background:rgba(236,230,216,.08)}.btn2:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.netstatus{font-size:13px;color:#c9c1b1;line-height:1.5}
.netplayers{display:flex;flex-wrap:wrap;gap:8px}
.np{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 10px;font-size:13px}
.np b{color:var(--muted);font-weight:500}.npa{font-family:var(--f-display);font-size:18px;font-weight:800}
.chip{font-size:11px;border:1px solid var(--line);color:var(--muted);padding:1px 6px}.chip.on{border-color:#4ee08a;color:#4ee08a}
.npnote{font-size:12px;color:var(--muted);align-self:center}
.mapsel{min-width:0}.maps{display:flex;flex-wrap:wrap;gap:8px}
.mapbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#16161a;padding:8px 12px 8px 8px;min-width:0}
.mapbtn canvas{width:96px;height:60px;flex:none;display:block}
.mapbtn[aria-pressed="true"]{border-color:var(--signal);background:linear-gradient(180deg,rgba(233,196,106,.12),#16161a 70%)}
.mapbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}.mapbtn:disabled{opacity:.35;cursor:not-allowed}
.mapinfo{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.mapinfo b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--paper);line-height:1}.mapinfo .en{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em}
.gyrorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tog{all:unset;cursor:pointer;border:1px solid var(--line);padding:7px 14px;font-size:13px;color:var(--muted);min-width:3em;text-align:center}
.tog[aria-pressed="true"]{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.tog:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.gyromsg{font-size:12px;color:var(--hostile);margin-top:6px;max-width:28ch}
.go:disabled{opacity:.45;cursor:not-allowed;filter:none}
.go{all:unset;cursor:pointer;background:var(--signal);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.06em;padding:10px 34px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.go:hover{filter:brightness(1.08)} .go:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.go.alt{background:var(--paper)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-mono);font-size:11px;color:var(--paper);border:1px solid var(--line);border-bottom-width:2px;padding:1px 6px;margin-right:4px}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.mapcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted)}
.mapcard b{color:var(--paper);font-family:var(--f-display);font-size:20px;font-weight:800;margin-right:4px}
.center{text-align:center;align-items:center;min-height:100%;justify-content:center}
.result{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,12vw,120px);line-height:.9}
.tline{display:flex;gap:28px;justify-content:center;font-family:var(--f-mono);color:var(--muted);font-size:13px;flex-wrap:wrap}
.tline b{display:block;font-family:var(--f-display);font-size:34px;color:var(--paper)}
#tbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:100px;display:grid;grid-template-columns:auto auto;gap:10px;align-items:end}
#tbtns button{all:unset;width:54px;height:54px;border-radius:50%;background:rgba(236,230,216,.14);border:1px solid rgba(236,230,216,.4);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--paper)}
#tbtns #tF{width:76px;height:76px;background:rgba(255,107,87,.3);border-color:var(--hostile);grid-row:span 2}
#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--paper)}
@media (max-width:560px){#hpNum,#ammo{font-size:36px}#hpBar{width:100px}#score .n{font-size:24px}#hint{display:none}}
#app.rot{position:fixed;top:0;left:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#app.rot #vitals,#app.rot #arms{bottom:max(12px,env(safe-area-inset-left,0px))}
.compact #hpNum,.compact #ammo{font-size:32px}.compact #ammo small{font-size:16px}.compact #hpBar{width:96px}
.compact #score{padding:3px 12px}.compact #score .n{font-size:22px}.compact #banner .big{font-size:46px}.compact #banner{top:20%}
.compact #abil{width:48px;height:48px}.compact #tbtns{bottom:74px}.compact #feed{font-size:11px}
.compact #tbtns button{width:50px;height:50px}.compact #tbtns #tF{width:68px;height:68px}
.phone-only{display:none}@media (pointer:coarse){.phone-only{display:inline}}
@media (prefers-reduced-motion:reduce){#hpFill{transition:none}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}body{font-size:14px}</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="遊戲畫面"></canvas>
  <canvas id="hud2d" aria-hidden="true"></canvas>

  <div class="hud" id="score" hidden>
    <span class="n" id="sYou">0</span>
    <div class="mid"><span id="sRound">第 1 回合</span><div class="alive" id="sAlive"></div></div>
    <span class="n foe" id="sFoe">0</span>
  </div>
  <div class="hud" id="feed"></div>
  <div class="hud" id="vitals" hidden>
    <div id="agentTag"></div>
    <div id="hpNum">100</div>
    <div id="hpBar"><div id="hpFill" style="width:100%"></div></div>
  </div>
  <div class="hud" id="arms" hidden>
    <div id="abil">
      <svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="rgba(15,17,18,.7)" stroke="#2b2924" stroke-width="3"/><circle id="abilRing" cx="29" cy="29" r="26" fill="none" stroke="#e9c46a" stroke-width="3" stroke-dasharray="163.4" stroke-dashoffset="0" transform="rotate(-90 29 29)"/></svg>
      <b id="abilKey">Q</b><span id="abilName"></span>
    </div>
    <div><div id="wname"></div><div id="ammo"></div></div>
  </div>
  <div class="hud" id="banner" hidden><div class="big" id="bBig"></div><div class="sub" id="bSub"></div></div>
  <div class="hud" id="note" hidden></div>
  <div class="hud" id="hint" hidden>WASD 移動 · 滑鼠轉視角 · 左鍵射擊 · R 換彈 · Q 技能 · Shift 靜步 · Esc 暫停</div>
  <div id="tbtns" hidden><button id="tQ" aria-label="施放技能">Q</button><button id="tF" aria-label="開火">開火</button><button id="tR" aria-label="換彈">R</button></div>

  <section class="sheet" id="menu">
    <div class="wrap">
      <div>
        <div class="eyebrow">第一人稱戰術射擊 · 單人或兩人連線</div>
        <h1>街頭<em>英豪</em></h1>
      </div>
      <div>
        <div class="lbl">遊戲模式</div>
        <div class="diff modes" id="modeSel"><button data-m="solo">單人</button><button data-m="duel">連線對戰 1v1</button><button data-m="coop">連線合作</button></div>
      </div>
      <p class="lede" id="lede"></p>
      <div class="netp" id="netPanel" hidden>
        <div class="netrow">
          <label class="lbl" for="roomCode" style="margin:0">房號</label>
          <input id="roomCode" type="text" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="房號">
          <button class="btn2" id="joinBtn">加入房間</button>
        </div>
        <div class="netstatus" id="netStatus" role="status"></div>
        <div><button class="btn2" id="fixBtn" hidden>重試連線</button></div>
        <div class="netplayers" id="netPlayers"></div>
      </div>
      <div>
        <div class="lbl">選擇特務</div>
        <div class="agents" id="agents"></div>
      </div>
      <div class="row">
        <div class="mapsel"><div class="lbl">選擇地圖</div><div class="maps" id="mapSel"></div></div>
        <div id="diffBox">
          <div class="lbl">敵方難度</div>
          <div class="diff" id="diff"><button data-d="easy">輕鬆</button><button data-d="normal">標準</button><button data-d="hard">困難</button></div>
        </div>
        <div>
          <div class="lbl">轉視角靈敏度</div>
          <label class="sens" for="sens"><input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1"><span id="sensVal">1.0</span></label>
        </div>
        <div id="gyroBox" hidden>
          <div class="lbl">陀螺儀瞄準</div>
          <div class="gyrorow"><button class="tog" id="gyroBtn" aria-pressed="false">關閉</button>
          <label class="sens" for="gyroSens" id="gyroSensWrap"><input type="range" id="gyroSens" min="0.3" max="3" step="0.1" value="1"><span id="gyroVal">1.0</span></label></div>
          <div class="gyromsg" id="gyroMsg" hidden></div>
        </div>
        <button class="go" id="start">進入對戰</button>
      </div>
      <div class="keys">
        <span><kbd>WASD</kbd>移動</span><span><kbd>滑鼠</kbd>轉視角</span><span><kbd>左鍵</kbd>射擊</span><span><kbd>R</kbd>換彈</span><span><kbd>Q</kbd>技能</span><span><kbd>Shift</kbd>靜步</span><span><kbd>← →</kbd>鍵盤轉向</span><span><kbd>Esc</kbd>暫停 / 放開滑鼠</span><span>手機：左半邊搖桿移動，右半邊拖曳轉視角，按「開火」射擊</span><span class="phone-only">開戰後畫面會自動轉成橫向，請把手機逆時針轉成橫拿（手機頂端朝左）</span>
      </div>
    </div>
  </section>

  <section class="sheet" id="pause" hidden>
    <div class="wrap center">
      <div class="eyebrow">暫停中</div>
      <div class="result">暫停</div>
      <p class="lede" id="pauseSub" hidden style="margin:0 auto">連線中遊戲不會停止，對方仍在行動。</p>
      <div class="row" style="justify-content:center"><button class="go" id="resume">點擊繼續</button><button class="go alt" id="quit">返回選單</button></div>
    </div>
  </section>

  <section class="sheet" id="end" hidden>
    <div class="wrap center">
      <div class="eyebrow" id="endEyebrow">對戰結束</div>
      <div class="result" id="endTitle">勝利</div>
      <div class="tline">
        <div><b id="endScore">5 : 3</b>比分</div>
        <div><b id="endKills">0</b>擊殺</div>
        <div><b id="endHs">0</b>爆頭</div>
        <div><b id="endAcc">0%</b>命中率</div>
      </div>
      <div class="row" style="justify-content:center"><button class="go" id="again">再來一場</button><button class="go alt" id="toMenu">換特務</button></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
const PREFIX='rustharbor-duel-v1-';
function makeRoomApi(){
 return {join:function(name){return new Promise(function(resolve,reject){
  let peer=null,conn=null,role=null,myPres={},otherPres=null,full=false,closed=false,settled=false,pending=false;
  const hs=[],errHs=[],hostId=PREFIX+name;
  const flush=function(){pending=false;const me={peer:role==='host'?'a':'b',sameTab:true,isMe:true,kind:'viewer',guest:false,by:null,presence:myPres};
   let ps=[me];
   if(full)ps=[{peer:'0',sameTab:false,presence:{}},{peer:'1',sameTab:false,presence:{}},Object.assign({},me,{peer:'z'})];
   else if(conn&&conn.open&&otherPres)ps.push({peer:role==='host'?'b':'a',sameTab:false,isMe:false,kind:'viewer',guest:false,by:null,presence:otherPres});
   for(const h of hs)try{h({peers:ps,joined:[],left:[],updated:[]})}catch(e){console.error(e)}};
  const soon=function(){if(!pending){pending=true;setTimeout(flush,0)}};
  const api={name:name,
   presence:function(p){myPres=p;if(conn&&conn.open){try{conn.send({p:p})}catch(e){}}return Promise.resolve()},
   onPeers:function(h,onErr){hs.push(h);if(onErr)errHs.push(onErr);soon();return function(){}},
   leave:function(){closed=true;try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}return Promise.resolve()},
   connected:function(){return !!(peer&&!peer.disconnected)}};
  const done=function(){if(!settled){settled=true;resolve(api)}soon()};
  const failJoin=function(e){if(!settled){settled=true;try{peer&&peer.destroy()}catch(_){}reject({code:'upstream_error',message:String(e&&e.type||e)})}};
  const wire=function(c){
   c.on('data',function(d){if(!d)return;if(d.full){full=true;soon();return}if(d.p){otherPres=d.p;soon()}});
   c.on('open',function(){try{c.send({p:myPres})}catch(e){}soon()});
   c.on('close',function(){if(conn!==c)return;conn=null;otherPres=null;soon();

function renderFeed(){$('feed').innerHTML='';for(const f of feed){const d=document.createElement('div');if(f.bad)d.className='bad';d.textContent=f.t;if(f.head){const em=document.createElement('em');em.textContent='爆頭';d.appendChild(em)}$('feed').appendChild(d)}}
function setScreens(){const playing=state==='playing'||state==='roundEnd';
 for(const id of ['score','vitals','arms'])$(id).hidden=!playing;
 $('hint').hidden=!(playing&&round===1&&!touch.used);$('tbtns').hidden=!(playing&&touch.used);
 if(!playing)$('note').hidden=true;
 app.classList.toggle('playing',playing&&!paused);applyOrient()}
function endMatch(){lastMatchOnline=online;const wasMode=mode;state='matchEnd';const won=pScore>eScore;unlock();online=false;net.ready=false;paused=false;$('pause').hidden=true;
 $('endEyebrow').textContent=lastMatchOnline?(wasMode==='duel'?(won?'你贏下這場對決':'對手贏下這場對決'):(won?`你們肅清了${MAP.name}`:'小隊任務失敗')):(won?`${MAP.name}已肅清`:'任務失敗');
 $('endTitle').textContent=won?'勝利':'敗北';$('endTitle').style.color=won?'#e9c46a':'#ff6b57';
 $('endScore').textContent=`${pScore} : ${eScore}`;$('endKills').textContent=stats.kills;$('endHs').textContent=stats.hs;$('endAcc').textContent=stats.shots?Math.round(stats.hits/stats.shots*100)+'%':'0%';
 $('again').textContent=lastMatchOnline?'再來一場（準備）':'再來一場';
 $('end').hidden=false;setScreens();renderLobby()}

// ---------- menu ----------
function glyph(a){const c=a.color;const s={kite:`<path d="M19 4 L34 19 L19 34 L22 19Z" fill="${c}"/><path d="M8 12 L18 19 L8 26Z" fill="${c}" opacity=".5"/>`,
 basalt:`<rect x="6" y="8" width="26" height="8" fill="${c}"/><rect x="6" y="20" width="12" height="10" fill="${c}" opacity=".6"/><rect x="20" y="20" width="12" height="10" fill="${c}"/>`,
 sol:`<circle cx="19" cy="19" r="7" fill="${c}"/><g stroke="${c}" stroke-width="3">${[0,1,2,3,4,5,6,7].map(i=>{const t=i*Math.PI/4;return`<line x1="${19+Math.cos(t)*11}" y1="${19+Math.sin(t)*11}" x2="${19+Math.cos(t)*16}" y2="${19+Math.sin(t)*16}"/>`}).join('')}</g>`,
 lumen:`<circle cx="19" cy="19" r="15" fill="none" stroke="${c}" stroke-width="2" opacity=".5"/><circle cx="19" cy="19" r="9" fill="none" stroke="${c}" stroke-width="2"/><circle cx="19" cy="19" r="3.5" fill="${c}"/>`};
 return `<svg class="glyph" viewBox="0 0 38 38" aria-hidden="true">${s[a.id]}</svg>`}
const LEDE={solo:'挑選一名特務，獨自潛入戰場，清除四名敵方特務即贏下一回合，先拿下 5 回合獲勝。爆頭傷害加倍；被擊中時畫面邊緣的紅色弧線會指向開槍的敵人。',
 duel:'和朋友 1 對 1 對決：兩人從地圖東西兩端出發，先擊倒對方的人拿下回合，先拿 5 回合獲勝。補血站兩人共用，被吃掉就要等 20 秒。',
 coop:'和朋友同一隊，一起對抗四名 AI 敵方特務。清光敵人贏下回合；兩人都陣亡就輸掉回合。先拿 5 回合獲勝。'};
function renderLobby(){
 const lockMode=!!(net.rm&&net.other&&!isHost);
 document.querySelectorAll('#modeSel button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.m===mode));b.disabled=lockMode&&b.dataset.m!==mode});
 renderMapSel();const onl=mode!=='solo';$('netPanel').hidden=!onl;$('diffBox').hidden=mode==='duel';$('lede').textContent=LEDE[mode];
 const st=$('start');
 if(!onl){st.textContent='進入對戰';st.disabled=false}
 else if(!net.rm){st.textContent='先加入房間';st.disabled=true}
 else if(net.full){st.textContent='房間已滿';st.disabled=true}
 else{st.textContent=net.ready?'取消準備':'準備';st.disabled=false}
 $('joinBtn').textContent=net.rm?'換房號':'加入房間';
 let s=net.msg;
 if(!s){if(net.api===undefined)s='正在檢查連線功能…';
  else if(!net.api)s='連線元件載入失敗，請確認網路正常後按「重試連線」。';else if(false)s=whyOff==='denied'?'你先前拒絕了這個遊戲的「即時連線」權限。按「開啟權限設定」把它打開，再按一次重試。'
   :whyOff==='prompt'?'這個遊戲需要「即時連線」權限，按「允許連線」即可。'
   :whyOff==='noviewer'?'這個畫面不是在 claude.ai 的遊戲頁裡開的，無法連線。請直接用分享連結在 claude.ai 開啟。'
   :'claude.ai 沒有讓這個畫面加入連線房間。最常見的原因是用「公開連結」開啟，或對方的帳號不在你的組織內（另一個人的個人帳號）。單人模式不受影響。';
  else if(!net.rm)s='兩人輸入同一個房號，按「加入房間」就會配對在一起。';
  else if(net.full)s=`房間 ${net.code} 已有兩位玩家，請換一個房號。`;
  else if(!net.other)s=`已加入房間 ${net.code}，等待另一位玩家加入…`;
  else{const pr=otherP();s=!net.ready?'對方已加入，選好特務後按「準備」。':!pr.rdy?'等待對方按「準備」…':'雙方都準備好了，即將開始…'}}
 $('netStatus').textContent=s;
 const fb=$('fixBtn');fb.hidden=!(net.api===null);fb.textContent=whyOff==='denied'?'開啟權限設定':whyOff==='prompt'?'允許連線':'重試連線';
 const box=$('netPlayers');box.innerHTML='';
 if(net.rm&&!net.full){const rows=[{who:'你',ag:pick,rdy:net.ready,host:isHost}];if(net.other){const pr=otherP();rows.push({who:'對方',ag:pr.ag,rdy:!!pr.rdy,host:!isHost})}
  for(const r of rows){const a=AGENTS.find(x=>x.id===r.ag)||AGENTS[0];const d=document.createElement('div');d.className='np';
   const w=document.createElement('b');w.textContent=r.who;const n=document.createElement('span');n.className='npa';n.style.color=a.color;n.textContent=a.name;
   d.append(w,n);if(r.host){const h=document.createElement('span');h.className='chip';h.textContent='房主';d.append(h)}
   const rd=document.createElement('span');rd.className='chip'+(r.rdy?' on':'');rd.textContent=r.rdy?'已準備':'未準備';d.append(rd);box.append(d)}
  if(lockMode){const n=document.createElement('div');n.className='npnote';n.textContent='遊戲模式和地圖由房主決定';box.append(n)}}
}
function renderMapSel(){const box=$('mapSel');if(!box)return;const lockMode=!!(net.rm&&net.other&&!isHost)||online;
 if(!box.childElementCount){for(const m of Object.values(MAPS)){const b=document.createElement('button');b.className='mapbtn';b.dataset.map=m.id;
   const c=document.createElement('canvas');c.width=120;c.height=75;const x=c.getContext('2d'),k=120/W;x.fillStyle=m.id==='mart'?'#cbc6bb':'#34312b';x.fillRect(0,0,120,75);
   const col={border:'#4a4f57',shelf:'#e85d2a',counter:'#c0392b',freezer:'#4a87a6',pallet:'#b88a55',cart:'#8d949c',island:'#4f7a3a'};
   for(const [wx,wy,ww,wh,kk] of m.walls){x.fillStyle=col[kk]||'#8d8373';x.fillRect(wx*k,wy*k,Math.max(1,ww*k),Math.max(1,wh*k))}
   x.fillStyle='#4ee08a';for(const [px,py] of m.pickups){x.fillRect(px*k-3,py*k-1,6,2);x.fillRect(px*k-1,py*k-3,2,6)}
   x.fillStyle='#7fd6ff';x.fillRect(80*k-2,500*k-2,4,4);x.fillStyle='#ff6b57';for(const [bx,by] of m.bots)x.fillRect(bx*k-1.5,by*k-1.5,3,3);
   const t=document.createElement('div');t.className='mapinfo';const nm=document.createElement('b');nm.textContent=m.name;const en=document.createElement('span');en.className='en';en.textContent=m.en;const d=document.createElement('span');d.className='md';d.textContent=m.desc;
   t.append(nm,en,d);b.append(c,t);b.onclick=()=>{if(b.disabled)return;loadMap(m.id);saveSettings();sendPresence()};box.append(b)}}
 for(const b of box.children){b.setAttribute('aria-pressed',String(b.dataset.map===mapId));b.disabled=lockMode&&b.dataset.map!==mapId}}
function buildMenu(){
 $('agents').innerHTML=AGENTS.map(a=>{const w=WEAPONS[a.weapon];const bars=[['生命',a.hp/150],['速度',a.speed/240],['火力',Math.min(1,w.dmg*w.pellets/w.rate/280)],['射程',w.range/1700]];
  return `<button class="agent" id="ag-${a.id}" data-id="${a.id}" style="--c:${a.color}" aria-pressed="${a.id===pick}"><span class="role">${a.role}</span>
   <div class="top">${glyph(a)}<div><div class="nm">${a.name}</div><div class="en">${a.en}</div></div></div>
   <div class="stats">${bars.map(([k,v])=>`<span>${k}</span><span class="bar"><i style="width:${Math.round(v*100)}%"></i></span>`).join('')}</div>
   <div class="wp">${w.name} · ${w.mag} 發</div>
   <div class="ab"><b>Q ${a.ab.name}</b>　${a.ab.desc}<br><span style="color:var(--muted);font-size:11px">冷卻 ${a.ab.cd} 秒</span></div></button>`}).join('');
 $('agents').onclick=e=>{const b=e.target.closest('.agent');if(!b)return;pick=b.dataset.id;saveSettings();document.querySelectorAll('.agent').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===pick)));sendPresence();renderLobby()};
 document.querySelectorAll('#diff button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.d===diff));b.onclick=()=>{diff=b.dataset.d;saveSettings();document.querySelectorAll('#diff button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.d===diff)))}});
 document.querySelectorAll('#modeSel button').forEach(b=>{b.onclick=()=>{if(b.disabled)return;mode=b.dataset.m;saveMode();if(mode==='solo')net.ready=false;sendPresence();renderLobby()}});
 $('sens').value=sens;$('sensVal').textContent=sens.toFixed(1);$('sens').oninput=e=>{sens=+e.target.value;$('sensVal').textContent=sens.toFixed(1);saveSettings()};
 $('roomCode').value=String(1000+Math.floor(Math.random()*9000));
 $('joinBtn').onclick=joinRoom;$('fixBtn').onclick=fixRoom;$('roomCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();joinRoom()}});
 renderMapSel();
 renderLobby()}

// ---------- pointer lock ----------
function lock(){if(touch.used||lockFailed)return;try{const r=gl.requestPointerLock&&gl.requestPointerLock();if(r&&r.catch)r.catch(()=>{lockFailed=true})}catch(e){lockFailed=true}}
function unlock(){try{if(document.pointerLockElement)document.exitPointerLock()}catch(e){}}
document.addEventListener('pointerlockchange',()=>{const was=locked;locked=document.pointerLockElement===gl;if(was&&!locked&&state==='playing'&&!paused)togglePause(true)});
document.addEventListener('pointerlockerror',()=>{lockFailed=true});
function grab(){try{gl.focus({preventScroll:true})}catch(e){}}
$('start').onclick=()=>{tryLandscape();if(mode==='solo'){$('menu').hidden=true;online=false;isHost=true;startMatch();grab();lock();return}
 if(!net.rm||net.full)return;net.ready=!net.ready;net.msg='';sendPresence();renderLobby()};
$('again').onclick=()=>{tryLandscape();$('end').hidden=true;if(lastMatchOnline&&net.rm){net.ready=true;net.msg='';state='menu';$('menu').hidden=false;setScreens();renderLobby();sendPresence()}else{online=false;isHost=true;if(mode!=='solo'){state='menu';$('menu').hidden=false;setScreens();renderLobby()}else{startMatch();grab();lock()}}};
$('toMenu').onclick=()=>{$('end').hidden=true;state='menu';net.ready=false;setScreens();$('menu').hidden=false;renderLobby();sendPresence()};
$('resume').onclick=()=>{togglePause(false);grab();lock()};
$('quit').onclick=()=>{if(online){abortOnline('');return}togglePause(false);state='menu';$('banner').hidden=true;setScreens();$('menu').hidden=false;renderLobby()};
function togglePause(v){if(state==='menu'||state==='matchEnd')return;paused=v;$('pause').hidden=!v;$('pauseSub').hidden=!online;mouse.down=false;if(v)unlock();setScreens()}

// ---------- input ----------
const KC={87:'KeyW',65:'KeyA',83:'KeyS',68:'KeyD',38:'ArrowUp',37:'ArrowLeft',40:'ArrowDown',39:'ArrowRight',82:'KeyR',81:'KeyQ',69:'KeyE',16:'ShiftLeft',27:'Escape'};
const KK={w:'KeyW',a:'KeyA',s:'KeyS',d:'KeyD',arrowup:'ArrowUp',arrowleft:'ArrowLeft',arrowdown:'ArrowDown',arrowright:'ArrowRight',r:'KeyR',q:'KeyQ',e:'KeyE',shift:'ShiftLeft',escape:'Escape','ㄊ':'KeyW','ㄇ':'KeyA','ㄋ':'KeyS','ㄎ':'KeyD','ㄐ':'KeyR','ㄆ':'KeyQ','ㄍ':'KeyE'};
function norm(e){let c=e.code||'';if(c==='ShiftRight')c='ShiftLeft';if(c&&c!=='Unidentified')return c;return KK[(e.key||'').toLowerCase()]||KC[e.keyCode]||''}
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const code=norm(e);if(!code)return;
 const inGame=state==='playing'||state==='roundEnd';if(inGame&&/^(Key[WASDRQE]|ShiftLeft|Arrow\w+)$/.test(code))e.preventDefault();
 if(e.repeat&&keys[code])return;keys[code]=true;
 if(code==='Escape')togglePause(!paused);
 if(paused||state!=='playing')return;
 if(code==='KeyR'&&player.alive)reload(player,player.w);
 if(code==='KeyQ'||code==='KeyE')useAbility()},true);
document.addEventListener('keyup',e=>{const code=norm(e);if(code)keys[code]=false},true);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false});
function local(e){if(rot)return{x:e.clientY,y:innerWidth-e.clientX};const r=gl.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
gl.addEventListener('pointerdown',e=>{grab();const p=local(e);
 if(e.pointerType==='touch'){if(!touch.used){touch.used=true;setScreens()}
  if(p.x<cw/2&&!touch.move)touch.move={id:e.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};else if(!touch.look)touch.look={id:e.pointerId,lx:p.x,ly:p.y}}
 else{if(touch.used){touch.used=false;setScreens()}
  if(state==='playing'&&!paused&&!locked&&!lockFailed){lock();return}
  if(e.button===0)mouse.down=true;if(e.button===2)mouse.look=true}
 try{gl.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
gl.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'){const p=local(e);
  if(touch.move&&touch.move.id===e.pointerId){let dx=(p.x-touch.move.ox)/50,dy=(p.y-touch.move.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}touch.move.dx=dx;touch.move.dy=dy}
  if(touch.look&&touch.look.id===e.pointerId&&player&&player.alive){player.angle+=(p.x-touch.look.lx)*.006*sens;player.pitch=clamp(player.pitch-(p.y-touch.look.ly)*.006*sens,-1,1);touch.look.lx=p.x;touch.look.ly=p.y}
  return}
 if(!player||!player.alive||paused||state==='menu'||state==='matchEnd')return;
 if(locked||(lockFailed&&(mouse.down||mouse.look))){player.angle+=(e.movementX||0)*.0022*sens;player.pitch=clamp(player.pitch-(e.movementY||0)*.0022*sens,-1,1)}});
function up(e){if(e.pointerType==='touch'){if(touch.move&&touch.move.id===e.pointerId)touch.move=null;if(touch.look&&touch.look.id===e.pointerId)touch.look=null}else{if(e.button===0)mouse.down=false;if(e.button===2)mouse.look=false}}
gl.addEventListener('pointerup',up);gl.addEventListener('pointercancel',up);
gl.addEventListener('contextmenu',e=>e.preventDefault());
$('tQ').addEventListener('pointerdown',e=>{e.preventDefault();useAbility()});
$('tR').addEventListener('pointerdown',e=>{e.preventDefault();if(player&&player.alive)reload(player,player.w)});
$('tF').addEventListener('pointerdown',e=>{e.preventDefault();touch.fire=true});
for(const ev of ['pointerup','pointercancel','pointerleave'])$('tF').addEventListener(ev,()=>{touch.fire=false});

// ---------- resize / loop ----------
function resize(){cw=Math.max(1,gl.clientWidth);ch=Math.max(1,gl.clientHeight);dpr=Math.min(2,window.devicePixelRatio||1);
 renderer.setPixelRatio(dpr);renderer.setSize(cw,ch,false);camera.aspect=cw/ch;gunCam.aspect=cw/ch;gunCam.updateProjectionMatrix();camera.fov=cw<ch?90:75;camera.updateProjectionMatrix();hud.width=Math.round(cw*dpr);hud.height=Math.round(ch*dpr)}
new ResizeObserver(resize).observe(gl);resize();
let lt=performance.now();
function frame(t){const raw=Math.min(1,Math.max(0,(t-lt)/1000)),dt=Math.min(.033,raw);lt=t;if(!paused||online)update(dt);netTick(raw);syncScene();renderer.clear();renderer.render(scene,camera);if(gunGroup&&gunGroup.visible){renderer.clearDepth();renderer.render(gunScene,gunCam)}drawHUD();updateDOM();requestAnimationFrame(frame)}
loadMap(savedMap);buildMenu();initGyroUI();initRoom();
requestAnimationFrame(frame);
})();
</script>
